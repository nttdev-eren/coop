<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Co-op 2 Chiều - Joystick Cả 2 Bên</title>
    <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-p1: #3b82f6;
            --accent-p2: #ef4444;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 { margin-bottom: 10px; font-size: 1.3rem; text-align: center; }
        .container { width: 100%; max-width: 800px; display: flex; flex-direction: column; gap: 15px; }
        .panel { background-color: var(--card-bg); padding: 15px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        input, button { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 10px; background: #0f172a; border: 1px solid #475569; color: #fff; border-radius: 6px; box-sizing: border-box; }
        button { background-color: #2563eb; border: none; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #1d4ed8; }
        
        #game-screen {
            display: none;
            position: relative;
            height: 350px;
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            border: 2px solid #475569;
        }
        .player-box {
            position: absolute;
            width: 50px;
            height: 50px;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            transition: transform 0.05s linear;
        }
        #p1 { background-color: var(--accent-p1); }
        #p2 { background-color: var(--accent-p2); }

        .hud { display: flex; justify-content: space-between; font-size: 0.85rem; color: #94a3b8; margin-bottom: 5px; }
        .control-area { display: flex; justify-content: space-between; align-items: center; gap: 15px; }
        #joystick-pad {
            width: 110px; height: 110px; background: #0f172a; border: 2px solid #475569; border-radius: 50%;
            position: relative; touch-action: none; display: flex; align-items: center; justify-content: center;
        }
        #joystick-knob { width: 45px; height: 45px; background: #3b82f6; border-radius: 50%; position: absolute; }
        
        .chat-container { display: flex; flex-direction: column; height: 130px; flex: 1; }
        #chat-messages { flex: 1; background: #0f172a; border: 1px solid #475569; border-radius: 6px; padding: 6px; overflow-y: auto; font-size: 0.8rem; margin-bottom: 6px; }
        .chat-input-row { display: flex; gap: 6px; }
        .chat-input-row input { margin: 0; }
        .chat-input-row button { width: 70px; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <h1>Co-op P2P - Joystick Cả 2 Bên</h1>

    <div class="panel" id="setup-panel">
        <h3>Nhập chung 1 Mã Phòng để chơi</h3>
        <label>Tên của bạn:</label>
        <input type="text" id="username" value="Npc_Player">

        <label>Mã phòng (VD: game123):</label>
        <input type="text" id="room-code" placeholder="Nhập mã phòng...">
        <button onclick="joinOrcreateRoom()">Vào Phòng</button>

        <div id="status" style="margin-top: 8px; font-weight: bold; color: #f59e0b;">Trạng thái: Sẵn sàng</div>
    </div>

    <div class="panel" id="game-container" style="display:none;">
        <div class="hud">
            <span id="fps">FPS: 60</span>
            <span id="role-display">Vai trò: --</span>
        </div>
        
        <div id="game-screen">
            <div id="p1" class="player-box">P1</div>
            <div id="p2" class="player-box">P2</div>
        </div>

        <div class="control-area" style="margin-top: 10px;">
            <div>
                <p style="margin: 0 0 5px 0; font-size: 0.8rem;">Joystick của bạn:</p>
                <div id="joystick-pad"><div id="joystick-knob"></div></div>
            </div>
            
            <div class="chat-container">
                <p style="margin: 0 0 5px 0; font-size: 0.8rem;">Khung Chat:</p>
                <div id="chat-messages"></div>
                <div class="chat-input-row">
                    <input type="text" id="chat-input" placeholder="Nhập tin nhắn..." onkeydown="if(event.key==='Enter') sendChat()">
                    <button onclick="sendChat()">Gửi</button>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    let peer, conn;
    let myRole = ''; // 'p1' hoặc 'p2'
    
    // Tọa độ riêng cho 2 bên
    let p1Pos = { x: 20, y: 20 };
    let p2Pos = { x: 280, y: 280 };
    
    let moveVector = { x: 0, y: 0 };

    function joinOrcreateRoom() {
        const code = document.getElementById('room-code').value.trim();
        if (!code) { alert("Vui lòng nhập mã phòng!"); return; }
        document.getElementById('status').innerText = "Đang kết nối...";

        peer = new Peer('npc-coop-' + code);

        peer.on('open', () => {
            myRole = 'p1'; // Máy tạo phòng trước là P1
            document.getElementById('role-display').innerText = "Vai trò: P1 (Xanh dương)";
            document.getElementById('status').innerText = "Đã tạo phòng, đang đợi người thứ 2...";
        });

        peer.on('error', (err) => {
            if (err.type === 'unavailable-id') {
                myRole = 'p2'; // Máy vào sau là P2
                document.getElementById('role-display').innerText = "Vai trò: P2 (Đỏ)";
                peer = new Peer();
                peer.on('open', () => {
                    conn = peer.connect('npc-coop-' + code);
                    setupConnection();
                });
            }
        });

        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection();
        });
    }

    function setupConnection() {
        conn.on('open', () => {
            document.getElementById('setup-panel').style.display = 'none';
            document.getElementById('game-container').style.display = 'block';
            requestAnimationFrame(gameLoop);
        });

        conn.on('data', (data) => {
            if (data.t === 'pos') {
                // Nhận tọa độ của người kia đồng bộ về máy mình
                if (myRole === 'p1') p2Pos = data.p;
                else p1Pos = data.p;
            } else if (data.t === 'chat') {
                addChat(data.s, data.m);
            }
        });
    }

    function gameLoop() {
        // Cập nhật vị trí nhân vật của chính mình dựa trên Joystick đang kéo
        let myCurrentPos = (myRole === 'p1') ? p1Pos : p2Pos;
        
        if (moveVector.x !== 0 || moveVector.y !== 0) {
            myCurrentPos.x += moveVector.x * 4;
            myCurrentPos.y += moveVector.y * 4;
            // Giới hạn trong khung game (rộng 350, trừ đi kích thước box 50px = 300)
            myCurrentPos.x = Math.max(0, Math.min(300, myCurrentPos.x));
            myCurrentPos.y = Math.max(0, Math.min(300, myCurrentPos.y));

            // Gửi tọa độ của mình cho máy bên kia ngay lập tức (P2P zero-latency)
            if (conn && conn.open) {
                conn.send({ t: 'pos', p: myCurrentPos });
            }
        }

        // Render vị trí cả 2 lên màn hình
        document.getElementById('p1').style.left = p1Pos.x + 'px';
        document.getElementById('p1').style.top = p1Pos.y + 'px';
        document.getElementById('p2').style.left = p2Pos.x + 'px';
        document.getElementById('p2').style.top = p2Pos.y + 'px';

        requestAnimationFrame(gameLoop);
    }

    // Xử lý Joystick đa hướng mượt mà cho từng máy
    let dragging = false, pad = document.getElementById('joystick-pad'), knob = document.getElementById('joystick-knob');
    
    pad.addEventListener('pointerdown', e => { dragging = true; });
    
    window.addEventListener('pointermove', e => {
        if (!dragging) return;
        let rect = pad.getBoundingClientRect();
        let x = e.clientX - rect.left - 55;
        let y = e.clientY - rect.top - 55;
        let dist = Math.hypot(x, y), angle = Math.atan2(y, x), maxR = 35;
        
        if (dist > maxR) { 
            x = Math.cos(angle) * maxR; 
            y = Math.sin(angle) * maxR; 
        }
        
        knob.style.transform = `translate(${x}px, ${y}px)`;
        
        // Tính vector hướng di chuyển chuẩn hóa (-1 đến 1)
        moveVector.x = x / maxR;
        moveVector.y = y / maxR;
    });

    window.addEventListener('pointerup', () => {
        dragging = false;
        knob.style.transform = `translate(0px, 0px)`;
        moveVector.x = 0;
        moveVector.y = 0;
    });

    // Chat hệ thống
    function sendChat() {
        let input = document.getElementById('chat-input'), msg = input.value.trim();
        let name = document.getElementById('username').value || 'User';
        if (!msg) return;
        addChat(name, msg);
        if (conn && conn.open) conn.send({ t: 'chat', s: name, m: msg });
        input.value = '';
    }
    function addChat(s, m) {
        let box = document.getElementById('chat-messages');
        box.innerHTML += `<div><b>${s}:</b> ${m}</div>`;
        box.scrollTop = box.scrollHeight;
    }
</script>
</body>
</html>
